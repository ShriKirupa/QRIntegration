<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Ticket</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .ticket {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      overflow: hidden;
      animation: fadeIn 0.8s ease;
    }

    .ticket-header {
      background: #111827;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .ticket-header h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .ticket-body {
      padding: 20px;
    }

    .field {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .field:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: 600;
      color: #374151;
    }

    .value {
      color: #111827;
      text-align: right;
    }

    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      background: #ecfdf5;
      color: #065f46;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      padding: 12px;
      background: #f9fafb;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="ticket" id="ticket">
    <div class="ticket-header">
      <h2>🎟 Event Pass</h2>
    </div>

    <div class="ticket-body" id="content">
      Loading ticket details...
    </div>

    <div class="footer">
      Generated via QR Scan
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const data = params.get("data");
    const content = document.getElementById("content");

    if (!data) {
      content.innerHTML = `<div class="error">No ticket data found</div>`;
    } else {
      try {
        const obj = JSON.parse(data);

        content.innerHTML = `
          <div class="field">
            <div class="label">Name</div>
            <div class="value">${obj.name || "-"}</div>
          </div>

          <div class="field">
            <div class="label">Event</div>
            <div class="value">${obj.event || "-"}</div>
          </div>

          <div class="field">
            <div class="label">Department</div>
            <div class="value">${obj.department || "-"}</div>
          </div>

          <div class="status">
            ${obj.status || "Active"}
          </div>
        `;
      } catch (e) {
        content.innerHTML = `<div class="error">Invalid ticket data</div>`;
      }
    }
  </script>

</body>
</html>
